<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Huddle | Build The Community Your Fans Will Love</title>
    <meta
      name="description"
      content="Huddle re-imagines the way we build communities. Create genuine connections with your audience today."
    />
    <meta
      name="keywords"
      content="community, platform, huddle, engagement, discussion"
    />
    <meta name="theme-color" content="#674baf" />

    <!-- Open Graph / Social Media SEO -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Huddle | Build The Community Your Fans Will Love"
    />
    <meta
      property="og:description"
      content="Huddle re-imagines the way we build communities. Create genuine connections with your audience today."
    />
    <meta property="og:image" content="./images/illustration-mockups.svg" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <!-- HEADER / LOGO -->
      <header class="header">
        <a href="#" aria-label="Huddle Homepage">
          <img src="./images/logo.svg" alt="Huddle Logo" class="logo" />
        </a>
      </header>

      <!-- MAIN CONTENT -->
      <main class="hero">
        <div class="hero-image-container">
          <img
            src="./images/illustration-mockups.svg"
            alt="Illustration of desktop and mobile dashboard mockups"
            class="hero-img"
          />
        </div>

        <div class="hero-content">
          <h1>Build The Community Your Fans Will Love</h1>
          <p>
            Huddle re-imagines the way we build communities. You have a voice,
            but so does your audience. Create connections with your users as you
            engage in genuine discussion.
          </p>
          <a href="#" class="btn-register" role="button">Register</a>
        </div>
      </main>

      <!-- FOOTER / SOCIAL & ATTRIBUTION -->
      <footer class="footer">
        <nav class="social-nav" aria-label="Social media channels">
          <ul class="social-links">
            <li>
              <a href="#" aria-label="Visit our Facebook page">
                <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
              </a>
            </li>
            <li>
              <a href="#" aria-label="Visit our Twitter account">
                <i class="fa-brands fa-twitter" aria-hidden="true"></i>
              </a>
            </li>
            <li>
              <a href="#" aria-label="Visit our Instagram profile">
                <i class="fa-brands fa-instagram" aria-hidden="true"></i>
              </a>
            </li>
          </ul>
        </nav>

        <div class="attribution">
          Challenge by
          <a
            href="https://www.frontendmentor.io?ref=challenge"
            target="_blank"
            rel="noopener noreferrer"
            >Frontend Mentor</a
          >. Coded by <a href="https://github.com/noldee">Vex</a>.
        </div>
      </footer>
    </div>
  </body>
</html>
