<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Project tracking intro component</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=Barlow:wght@400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Background decorative shape -->
    <div class="bg-shape"></div>

    <div class="page-wrapper">
      <!-- HEADER -->
      <header class="header">
        <a href="#" class="logo" aria-label="Monograph Home">
          <svg
            width="32"
            height="32"
            viewBox="0 0 32 32"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g fill="none" fill-rule="evenodd">
              <rect fill="#1E2536" width="32" height="32" rx="4" />
              <path
                d="M11 9h3.5v14H11V9zm6.5 0H21v6.25L17.5 9zm0 7.75L21 23h-3.5l-3.5-6.25 3.5-3.875z"
                fill="#FFF"
              />
            </g>
          </svg>
        </a>

        <!-- Mobile menu toggle button -->
        <button
          class="menu-toggle"
          id="menu-toggle"
          aria-label="Toggle Navigation Menu"
          aria-expanded="false"
        >
          <svg
            class="icon-hamburger"
            width="24"
            height="16"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g fill="#242942" fill-rule="evenodd">
              <path d="M0 0h24v2H0zM0 7h24v2H0zM0 14h24v2H0z" />
            </g>
          </svg>
          <svg
            class="icon-close"
            width="20"
            height="20"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M17.778.808l2.122 2.122L12.12 10.73l7.779 7.778-2.122 2.122L10 12.852l-7.778 7.778-2.122-2.122L7.88 10.73.101 2.93 2.223.808 10 8.606z"
              fill="#242942"
              fill-rule="evenodd"
            />
          </svg>
        </button>

        <!-- Navigation -->
        <nav class="nav" id="nav-menu">
          <ul class="nav__list">
            <li class="nav__item"><a href="#" class="nav__link">PRODUCT</a></li>
            <li class="nav__item">
              <a href="#" class="nav__link">FEATURES</a>
            </li>
            <li class="nav__item"><a href="#" class="nav__link">PRICING</a></li>
            <li class="nav__divider" aria-hidden="true"></li>
            <li class="nav__item">
              <a href="#" class="nav__link nav__link--muted">LOGIN</a>
            </li>
          </ul>
        </nav>
      </header>

      <!-- HERO SECTION -->
      <main class="hero">
        <div class="hero__illustration">
          <svg
            viewBox="0 0 960 550"
            xmlns="http://www.w3.org/2000/svg"
            class="hero__svg"
          >
            <defs>
              <filter
                x="-5%"
                y="-5%"
                width="110%"
                height="110%"
                filterUnits="objectBoundingBox"
                id="shadow"
              >
                <feDropShadow
                  dx="0"
                  dy="25"
                  stdDeviation="25"
                  flood-color="#000"
                  flood-opacity="0.15"
                />
              </filter>
            </defs>
            <g fill="none" fill-rule="evenodd">
              <!-- Mobile Preview -->
              <g filter="url(#shadow)" transform="translate(40, 40)">
                <rect
                  fill="#1E2536"
                  x="0"
                  y="0"
                  width="200"
                  height="380"
                  rx="20"
                />
                <rect
                  fill="#FFFFFF"
                  x="12"
                  y="30"
                  width="176"
                  height="320"
                  rx="8"
                />
                <rect
                  fill="#FF6464"
                  x="28"
                  y="130"
                  width="120"
                  height="20"
                  rx="10"
                />
                <rect
                  fill="#A04B4B"
                  x="154"
                  y="130"
                  width="20"
                  height="20"
                  rx="10"
                />
                <rect
                  fill="#FF6464"
                  x="28"
                  y="160"
                  width="80"
                  height="20"
                  rx="10"
                />
                <rect
                  fill="#FF6464"
                  x="120"
                  y="210"
                  width="50"
                  height="20"
                  rx="10"
                />
              </g>
              <!-- Laptop Preview -->
              <g filter="url(#shadow)" transform="translate(280, 20)">
                <rect
                  fill="#1E2536"
                  x="0"
                  y="0"
                  width="640"
                  height="420"
                  rx="12"
                />
                <rect fill="#2B3245" x="20" y="20" width="140" height="380" />
                <circle fill="#FF6464" cx="45" cy="45" r="10" />
                <rect fill="#FFFFFF" x="180" y="20" width="440" height="380" />
                <rect
                  fill="#E8EEF3"
                  x="210"
                  y="45"
                  width="220"
                  height="30"
                  rx="15"
                />
                <rect
                  fill="#FF6464"
                  x="210"
                  y="180"
                  width="280"
                  height="24"
                  rx="12"
                />
                <rect
                  fill="#A04B4B"
                  x="270"
                  y="215"
                  width="220"
                  height="24"
                  rx="12"
                />
                <rect
                  fill="#FF6464"
                  x="210"
                  y="250"
                  width="80"
                  height="24"
                  rx="12"
                />
                <rect
                  fill="#FF6464"
                  x="210"
                  y="285"
                  width="340"
                  height="24"
                  rx="12"
                />
              </g>
            </g>
          </svg>
        </div>

        <div class="hero__content">
          <div class="hero__badge-container">
            <span class="badge">NEW</span>
            <span class="subtitle">MONOGRAPH DASHBOARD</span>
          </div>

          <h1 class="hero__title">POWERFUL INSIGHTS INTO YOUR TEAM</h1>

          <p class="hero__description">
            Project planning and time tracking for agile teams
          </p>

          <div class="hero__cta">
            <a href="#" class="btn">SCHEDULE A DEMO</a>
            <span class="cta-notice">TO SEE A PREVIEW</span>
          </div>
        </div>
      </main>

      <!-- FOOTER -->
      <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="https://github.com/noldee">Noldee</a>.
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
